name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify embedded model catalogs
        run: bash .github/scripts/verify-embedded-model-catalogs.sh
      - name: Test YAML persistence and downstream WebSocket negotiation
        env:
          TZ: UTC
        run: >-
          go test -mod=readonly -race -count=1 ./internal/config ./internal/api
          -run '^(TestMergePreservesScalarValueTypesAndPresentation|TestManagementQuotedRequestLogPersistsTypedBoolean|TestDownstreamWebsocketCompressionInstancesAndReload)$'
      - name: Verify management reads during configuration reload
        run: >-
          go test -mod=readonly -race -count=1 ./internal/api/handlers/management
          -run '^(TestHandlerSnapshotOwnsConfigAndPluginYAML|TestHandlerSnapshotGetConfigDuringSetConfig|TestHandlerSnapshotCatalogDuringPluginHostSwap|TestAPIKeyListConcurrentPersistence)$'
      - name: Validate Linux configuration saves, recovery and permissions
        run: bash .github/scripts/verify-linux-config-saves.sh
      - name: Verify per-instance local credential storage
        env:
          GIN_MODE: release
        run: >-
          go test -mod=readonly -race -count=1 ./internal/api ./sdk/auth ./sdk/cliproxy
          -run '^(TestOrdinaryVertexImportDefaultStoreIsolation|TestOrdinaryFileStoreViewsShareRootWriteLock|TestIndependentManagerSaveDirectoryIsPerCall|TestOrdinaryManagerLoginPreservesDefaultFileDirectory|TestOrdinaryBuilderLocalStoreDirectoryIsolation)$'
      - name: Verify provider lists commit before publication
        env:
          GIN_MODE: release
        run: >-
          go test -mod=readonly -race -count=1 ./internal/api ./internal/api/handlers/management
          -run '^(TestRegisteredProviderListsCommitBeforeVisibility|TestProviderReviewConcurrentScalarReader|TestProviderReviewReloadReceivesCommittedConfigWithoutHoldingHandlerLock)$'
      - name: Verify plugin configuration saves
        env:
          GIN_MODE: release
        run: >-
          go test -mod=readonly -race -count=1 ./internal/api ./internal/api/handlers/management
          -run '^(TestPluginConfigWritePreservesLastSavedValue|TestPluginConfigWritesRejectUnavailableConfig|TestPatchPluginEnabled(UpdatesOnlyPluginConfig|ReloadSnapshotRawImmutability)|TestPutPluginConfigReplacesPluginConfig|TestPatchPluginConfigMergesAndDeletesFields|TestConfigReloadGenerationSkipsOlderSnapshot|TestPluginDeleteLocalRecovery|TestDeletePlugin(RejectsUnresolvedPluginsDir|ReturnsNotFoundForUnknownPlugin|UsesConfiguredStoreVersionWhenFilesCoexist|RemovesDiscoveredFileAndConfig))$'
      - name: Verify durable removal and file registration
        run: >-
          go test -mod=readonly -race -count=1 -timeout=2m
          ./internal/api/handlers/management ./sdk/cliproxy/auth ./sdk/cliproxy
          -run '^(TestFileFence.*|TestDurableLocalRemoval.*|TestRemoveIfRetiresAfterCanceledRequestAndPersistenceWait|TestRegistered.*Local.*|TestLocalV8DeleteRegistryCleanupFollowsRegistrationEpoch|TestUnregisteredLocalFileThroughGinDelete|TestObservedLocalDeleteRejectsReplacementAndCancel|TestLocalGinDeleteKeepsReplacementWhileWaiting|TestLocalGinDeleteWaitsForSDKManagerLoad|TestWatcherRestoresFirstRegistrationAfterFileRemoval|TestHandleAuthUpdatesDiscardedSnapshotTriggersWatcherReread|TestHandleAuthUpdatesFileSnapshotKeepsCooldown|TestRuntimeAuthSyncHook_(DelayedPersistedSnapshotCannotUndoDisable|DiscardedLoginCacheCannotUndoDisableOnReload))$'
      - name: Test ordinary usage history and management writes
        env:
          GIN_MODE: release
        run: |
          go test -mod=readonly -race -count=1 -timeout=2m ./internal/usage
          go test -mod=readonly -race -count=1 -timeout=2m ./internal/api/handlers/management -run '^Test(GetUsageQueue|GetUsageStatistics|ExportUsageStatistics)'
          go test -mod=readonly -race -count=1 -timeout=2m ./internal/api -run '^Test(CombinedOrdinaryUsage|RegisteredPricingWriteFailure|UsageImportValidity|UsageInstanceColdStart|UsageSDKChatAttribution|UsageRecorderConfiguration|UsageKnownKeyConfiguration|UsageDeferredShutdown|UsageImportWriteFailure)'
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: Cross-build for Solaris
        env:
          GOOS: solaris
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -o test-output-solaris ./cmd/server
          rm -f test-output-solaris
