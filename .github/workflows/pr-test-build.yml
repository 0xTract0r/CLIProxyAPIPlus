name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  ordinary-contracts:
    name: Ordinary upstream-sync contracts
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, 'upstream-sync') ||
        startsWith(github.head_ref, 'bot/upstream-sync') ||
        startsWith(github.head_ref, 'codex/upstream-sync') ||
        startsWith(github.head_ref, 'codex/sync-core') ||
        startsWith(github.head_ref, 'codex/integrate-prod-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare test modules
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go mod download
      - name: Verify reviewed ordinary contracts on loopback
        run: >-
          bash .github/scripts/run-loopback-only.sh env GOTOOLCHAIN=local GOWORK=off GOPROXY=off
          python3 .github/scripts/check-ordinary-pr-tests.py --run-selected

      - name: Run full usage and local key-value storage package tests
        run: >-
          bash .github/scripts/run-loopback-only.sh env GOTOOLCHAIN=local GOWORK=off GOPROXY=off
          go test -mod=readonly -race -count=1 -timeout=120s -v
          ./internal/usage ./sdk/cliproxy/usage ./internal/kvstore

  seaweedfs-storage:
    name: S3-compatible credential storage
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, 'upstream-sync') ||
        startsWith(github.head_ref, 'bot/upstream-sync') ||
        startsWith(github.head_ref, 'codex/upstream-sync') ||
        startsWith(github.head_ref, 'codex/sync-core') ||
        startsWith(github.head_ref, 'codex/integrate-prod-')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare test modules
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: go mod download
      - name: Verify release asset and exercise isolated S3 storage
        shell: bash
        run: |
          set -euo pipefail
          private="$(mktemp -d /tmp/cpa-s3.XXXXXX)"
          trap 'rm -rf -- "$private"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 90 --max-filesize 49059307 \
            https://github.com/seaweedfs/seaweedfs/releases/download/4.55/linux_amd64.tar.gz \
            --output "$private/weed.tar.gz"
          test "$(wc -c <"$private/weed.tar.gz")" -eq 49059307
          printf '%s  %s\n' f156c609eeaf9e5fcfeea33fd70411222005f83760aa95893c9d58eff006b45c "$private/weed.tar.gz" | sha256sum -c -
          tar -xzf "$private/weed.tar.gz" -C "$private" --no-same-owner --no-same-permissions weed
          bash .github/scripts/run-loopback-only.sh bash .github/scripts/run-seaweedfs-integration.sh "$private/weed" "$private"

  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SYNC_PR: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'upstream-sync') ||
          startsWith(github.head_ref, 'bot/upstream-sync') ||
          startsWith(github.head_ref, 'codex/upstream-sync') ||
          startsWith(github.head_ref, 'codex/sync-core') ||
          startsWith(github.head_ref, 'codex/integrate-prod-')
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Upstream sync test preflight
        if: env.UPSTREAM_SYNC_PR == 'true'
        run: GOTOOLCHAIN=local GOWORK=off GOPROXY=off go run .github/scripts/upstream-sync-test-preflight.go -pr-event "$GITHUB_EVENT_PATH"
      - name: Prepare upstream sync test dependencies
        if: env.UPSTREAM_SYNC_PR == 'true'
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go version
          go mod download
          go list -deps -test ./... >/dev/null
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          results="$(mktemp)"
          trap 'rm -f "$results"' EXIT
          if [[ "$UPSTREAM_SYNC_PR" == 'true' ]]; then
            bash .github/scripts/run-loopback-only.sh env GOTOOLCHAIN=local GOWORK=off GOPROXY=off \
              go test -json -count=1 -timeout 600s ./... | tee "$results"
          else
            GOTOOLCHAIN=auto go test -json -count=1 -timeout 600s ./... | tee "$results"
          fi
          python3 .github/scripts/check-ordinary-pr-tests.py "$results"
      - name: Ordinary fork feature survival audit
        run: |
          bash scripts/upstream-sync/check-fork-features-alive.sh . \
            --manifest scripts/upstream-sync/ordinary-fork-feature-manifest.tsv
      # IMPORTANT: keep "Refresh models catalog" AFTER "Test". This step rewrites the
      # committed model catalog on disk; registry tests assert the committed catalog
      # state, so running it before "Test" mutates the catalog and turns those
      # assertions into false failures. Do not reorder these two steps.
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: Cross-build for Solaris
        env:
          GOOS: solaris
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -o test-output-solaris ./cmd/server
          rm -f test-output-solaris
