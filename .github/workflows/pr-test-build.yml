name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SYNC_PR: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'upstream-sync') ||
          startsWith(github.head_ref, 'bot/upstream-sync') ||
          startsWith(github.head_ref, 'codex/upstream-sync') ||
          startsWith(github.head_ref, 'codex/sync-core') ||
          startsWith(github.head_ref, 'codex/integrate-prod-')
        }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Upstream sync test preflight
        if: env.UPSTREAM_SYNC_PR == 'true'
        run: GOTOOLCHAIN=local GOWORK=off GOPROXY=off go run .github/scripts/upstream-sync-test-preflight.go -pr-event "$GITHUB_EVENT_PATH"
      - name: Prepare upstream sync test dependencies
        if: env.UPSTREAM_SYNC_PR == 'true'
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          go version
          go mod download
          go list -deps -test ./... >/dev/null
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          results="$(mktemp)"
          trap 'rm -f "$results"' EXIT
          if [[ "$UPSTREAM_SYNC_PR" == 'true' ]]; then
            bash .github/scripts/run-loopback-only.sh env GOTOOLCHAIN=local GOWORK=off GOPROXY=off \
              go test -json -count=1 -timeout 600s ./... | tee "$results"
          else
            GOTOOLCHAIN=auto go test -json -count=1 -timeout 600s ./... | tee "$results"
          fi
          python3 .github/scripts/check-ordinary-pr-tests.py "$results"
      - name: Ordinary fork feature survival audit
        run: |
          bash scripts/upstream-sync/check-fork-features-alive.sh . \
            --manifest scripts/upstream-sync/ordinary-fork-feature-manifest.tsv
      # IMPORTANT: keep "Refresh models catalog" AFTER "Test". This step rewrites the
      # committed model catalog on disk; registry tests assert the committed catalog
      # state, so running it before "Test" mutates the catalog and turns those
      # assertions into false failures. Do not reorder these two steps.
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: Cross-build for Solaris
        env:
          GOOS: solaris
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -o test-output-solaris ./cmd/server
          rm -f test-output-solaris
