name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: GOTOOLCHAIN=auto go test -timeout 600s ./...
      # IMPORTANT: keep "Refresh models catalog" AFTER "Test". This step rewrites the
      # committed model catalog on disk; registry tests assert the committed catalog
      # state, so running it before "Test" mutates the catalog and turns those
      # assertions into false failures. Do not reorder these two steps.
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
      - name: fork feature survival audit
        run: bash scripts/upstream-sync/check-fork-features-alive.sh
