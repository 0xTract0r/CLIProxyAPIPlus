name: translator-path-guard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  ensure-no-translator-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect internal/translator changes
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            internal/translator/**
      - name: Fail when restricted paths change
        # The "upstream-sync" label exempts whole-repo upstream merge PRs, which
        # necessarily touch internal/translator/**. Normal PRs stay guarded.
        if: steps.changed-files.outputs.any_changed == 'true' && !contains(github.event.pull_request.labels.*.name, 'upstream-sync')
        run: |
          echo "Changes under internal/translator are not allowed in pull requests."
          echo "Add the 'upstream-sync' label for whole-repo upstream merge PRs, or"
          echo "create an issue for our maintenance team to make the necessary changes."
          exit 1
