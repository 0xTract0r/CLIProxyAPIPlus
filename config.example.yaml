#     - name: "gemini-pro-agent"                   # upstream Antigravity model id
#       alias: "gemini-3.1-pro-preview"            # client-visible id (Gemini 3.1 Pro Preview)
#       display-name: "Antigravity Gemini 3.1 Pro" # optional catalog display name
